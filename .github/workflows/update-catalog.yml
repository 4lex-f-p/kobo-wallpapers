name: Update wallpaper catalog

on:
  # Permite executar manualmente pelo botão "Run workflow"
  workflow_dispatch:

  # Executa automaticamente quando houver alterações nos wallpapers
  # ou no próprio gerador do catálogo
  push:
    branches:
      - main
    paths:
      - "wallpaper/**"
      - "generate_catalog.py"

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate catalog
        run: python generate_catalog.py

      - name: Check generated catalog
        run: |
          echo "Generated catalog:"
          cat catalog.json

      - name: Commit updated catalog
        run: |
          if git diff --quiet catalog.json; then
            echo "Catalog already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add catalog.json
          git commit -m "Auto-update wallpaper catalog"
          git push
